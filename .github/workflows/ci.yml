name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run every tool against the W3C BAD demo (read-only)
        run: |
          set -e
          B=https://www.w3.org/WAI/demos/bad
          U=$B/before/home.html,$B/after/home.html
          node inventory.mjs --urls "$U"
          node axe-scan.mjs --urls "$U" --widths 390
          node tab-walk.mjs --urls "$U" --width 390 --max 30 --settle 300
          node focus-state.mjs --urls "$U" --selector "a"
          node menu-modal.mjs --urls "$B/after/home.html" --trigger "select" 
          node forms.mjs --urls "$U" --try-empty-submit
          node reflow.mjs --urls "$U"
          node motion.mjs --urls "$U"
          node sr-transcript.mjs --urls "$U" --max 300
          node context-change.mjs --urls "$U"
          node sample-compare.mjs --urls "$B/before/home.html,$B/before/news.html,$B/before/tickets.html" --title-strip '\s*\[(In)?accessible [^\]]*\]$'
      - name: Expected detections on the "before" page
        run: |
          grep -q "CHANGE-ON-INPUT" audit-output/context-change/*before_home*.txt
          grep -q "FOCUS-REMOVED" audit-output/context-change/*before_home*.txt
          grep -q "DUP-TITLE" audit-output/sample-compare/sample-compare.txt
          grep -q "Simulated screen reader output" audit-output/sr-transcript/*before_home*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-output
          path: audit-output/
