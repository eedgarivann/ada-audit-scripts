name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    # Offline-safe: every tool runs against the static pages in test/fixtures,
    # served GET-only on 127.0.0.1. No third-party site is contacted.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run all tools on local fixtures and check planted defects + clean controls
        run: OUT=audit-output/fixtures npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-output
          path: audit-output/
