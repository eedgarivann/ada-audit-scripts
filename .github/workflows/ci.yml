name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
        env:
          CONCURRENCY: 4
      - name: Validate packaged API and CLI
        run: |
          node -e "import('./src/index.mjs').then(m => { if (!m.buildDocument) process.exit(1) })"
          node bin/ada-audit.mjs validate docs/sample-report/findings.json
          npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-fixtures-node-${{ matrix.node }}
          path: audit-output/fixtures/
          retention-days: 7
